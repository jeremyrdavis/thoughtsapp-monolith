{#if thought}
<blockquote class="thought">
    <p class="content">{thought.content}</p>
    <footer class="author">&mdash; {thought.authorName}{#if thought.authorBio}, {thought.authorBio}{/if}</footer>
</blockquote>
{#else}
<p class="empty-state">No thoughts to show yet. Check back soon!</p>
{/if}
<div class="card-actions">
    <button class="btn-primary" hx-get="/thoughts/random" hx-target="#thought-card" hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Another
    </button>
</div>
